<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Деньги наперёд</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f1f2f5);
  --text: var(--tg-theme-text-color, #15171a);
  --hint: var(--tg-theme-hint-color, #8b9099);
  --accent: var(--tg-theme-button-color, #2b7fe0);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --green: #1c9a63;
  --red: #dc4747;
  --plan: #b7791f;
  --radius-lg: 18px;
  --radius-sm: 10px;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not(.tg){
    --bg:#16181c; --bg2:#202329; --text:#eceef1; --hint:#868b94; --accent:#4a9bf0;
  }
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:0 14px 90px}

/* hero */
.hero{padding:18px 4px 10px}
.hero-label{color:var(--hint);font-size:14px}
.hero-amount{font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:2px 0 4px;transition:color .2s}
.hero-amount.neg{color:var(--red)}
.hero-sub{font-size:14px;color:var(--hint);min-height:20px}
.hero-sub b{color:var(--text);font-weight:600}
.hero-warn{color:var(--red);font-size:14px;margin-top:4px}

/* slider */
.slider-wrap{margin:16px 0 4px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--bg2) var(--p,0%))}
input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--bg2)}
input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;border-radius:50%;background:var(--bg);border:3px solid var(--accent);box-shadow:0 2px 6px rgba(0,0,0,.18)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--bg);border:3px solid var(--accent)}
input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--hint)}
.scale button{background:none;border:0;padding:4px 0;color:var(--hint);cursor:pointer}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:4px;background:var(--bg);border-top:1px solid var(--bg2);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;max-width:140px;border:0;background:none;padding:6px 4px;border-radius:12px;font-size:12px;color:var(--hint);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--accent);background:var(--bg2)}

/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px}
.cal-head h2{margin:0;font-size:18px;font-weight:700;text-transform:capitalize}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--bg2);font-size:20px;cursor:pointer}
.wd{display:grid;grid-template-columns:repeat(7,1fr);font-size:12px;color:var(--hint);text-align:center;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{position:relative;aspect-ratio:1/1.12;border:0;border-radius:var(--radius-sm);background:var(--bg2);padding:4px 2px 7px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;overflow:hidden;min-width:0}
.cell.empty{background:none;pointer-events:none}
.cell .d{font-size:14px;font-weight:600}
.cell .b{font-size:10.5px;color:var(--hint);white-space:nowrap}
.cell .dots{display:flex;gap:3px;height:6px}
.cell .dots i{width:6px;height:6px;border-radius:50%;display:block}
.dot-in{background:var(--green)} .dot-out{background:var(--red)} .dot-plan{background:var(--plan)}
.cell .gauge{position:absolute;left:0;bottom:0;height:3px;width:var(--lvl,0%);background:var(--green);opacity:.75}
.cell.neg .gauge{width:100%;background:var(--red)}
.cell.neg .b{color:var(--red);font-weight:600}
.cell.past{opacity:.5}
.cell.today .d{color:var(--accent)}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px}

/* day panel */
.day{margin-top:16px;background:var(--bg2);border-radius:var(--radius-lg);padding:14px}
.day h3{margin:0;font-size:16px;text-transform:capitalize}
.day .bal{color:var(--hint);font-size:14px;margin-top:2px}
.list{margin:10px 0 0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--hint) 20%,transparent);cursor:pointer}
.row:first-child{border-top:0}
.row .ic{font-size:20px;width:26px;text-align:center}
.row .t{flex:1;min-width:0}
.row .t small{display:block;color:var(--hint);font-size:12px}
.row .a{font-weight:700;white-space:nowrap}
.by{display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:var(--hint);font-size:12px;font-weight:400;vertical-align:1px}
.av{width:16px;height:16px;border-radius:50%;object-fit:cover;background:var(--accent);color:var(--accent-text,#fff);font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex:none}
.lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:6px}.lock b{font-size:48px}.lock h2{margin:8px 0 0}.lock p{color:var(--hint);margin:0;max-width:320px}
.mem{display:flex;align-items:center;gap:10px;padding:6px 0}
.mem .av{width:30px;height:30px;font-size:14px}
.pos{color:var(--green)} .negc{color:var(--red)} .planc{color:var(--plan)}
.empty-note{color:var(--hint);font-size:14px;margin:10px 0 0}
.actions{display:flex;gap:8px;margin-top:12px}

.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-text);flex:1}
.btn.soft{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.btn.danger{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.btn:focus-visible,.icon-btn:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.block{width:100%;display:block;margin-top:8px}

/* sections */
.sec-title{font-size:18px;font-weight:700;margin:18px 0 10px}
.card{background:var(--bg2);border-radius:var(--radius-lg);padding:4px 14px;margin-bottom:12px}
.card.pad{padding:14px}
.hint{color:var(--hint);font-size:13px}
.bar{height:8px;border-radius:8px;background:color-mix(in srgb,var(--hint) 20%,transparent);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);border-radius:8px}
.totals{display:flex;gap:10px;margin-bottom:12px}
.totals>div{flex:1;background:var(--bg2);border-radius:var(--radius-lg);padding:12px}
.totals b{display:block;font-size:20px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.4)}
.sheet-body{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-body{animation:none}.hero-amount{transition:none}}
.sheet-body h2{margin:0 0 12px;font-size:19px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--hint);margin-bottom:4px}
.field input,.field select{width:100%;border:1px solid transparent;background:var(--bg2);border-radius:12px;padding:12px;font-size:16px;outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.field input[type=date]{min-width:0;max-width:100%;min-height:46px;-webkit-appearance:none;appearance:none;text-align:left}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}
.field[hidden]{display:none}
.dash-card{background:var(--bg2);border-radius:var(--radius-lg);padding:12px 14px;margin-bottom:12px}
.dash-card .big{font-size:24px;font-weight:700;display:block;margin:2px 0}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpis>div{background:var(--bg2);border-radius:var(--radius-lg);padding:10px 12px;min-width:0}
.kpis b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis small{display:block;color:var(--hint);font-size:12px;margin-top:2px}
.donut-wrap{display:flex;align-items:center;gap:14px}
.donut{width:132px;height:132px;flex:0 0 132px}
.donut text{fill:var(--text);font-weight:700}
.legend{flex:1;min-width:0;font-size:13px}
.legend div{display:flex;align-items:center;gap:6px;margin:4px 0;white-space:nowrap;overflow:hidden}
.legend i,.crow i.sw{width:10px;height:10px;border-radius:3px;flex:0 0 10px;display:inline-block}
.legend span{overflow:hidden;text-overflow:ellipsis;flex:1}
.crow{display:block;padding:10px 0;border-top:1px solid color-mix(in srgb,var(--hint) 20%,transparent);cursor:pointer}
.crow:first-child{border-top:0}
.crow .top{display:flex;align-items:center;gap:8px}
.crow .top .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--hint);margin-top:4px}
.up{color:var(--red)} .down{color:var(--green)}
.dot-priv{background:var(--hint)} .dot-move{background:var(--accent)} .movec{color:var(--accent)}
.emojis{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.emojis button{font-size:22px;width:42px;height:42px;border:0;border-radius:10px;background:var(--bg2);cursor:pointer}
.emojis button.on{outline:2px solid var(--accent);outline-offset:-2px}
.amt{display:flex;gap:6px}.field .amt input{flex:1;min-width:0}.field .amt select{width:auto;flex:0 0 auto;padding:12px 8px}
.seg{display:flex;background:var(--bg2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg label{flex:1;text-align:center;padding:9px 4px;border-radius:10px;font-size:14px;cursor:pointer}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--bg);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chips label{padding:7px 11px;border-radius:20px;background:var(--bg2);font-size:14px;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips label:has(input:checked),.chips label.on{background:var(--accent);color:var(--accent-text)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.result{margin-top:12px;padding:12px;border-radius:12px;background:var(--bg2)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30}
</style>
</head>
<body>
<div id="app">
  <header class="hero">
    <div class="hero-label" id="heroLabel">Остаток</div>
    <div class="hero-amount num" id="heroAmount">—</div>
    <div class="hero-sub" id="heroSub"></div>
    <div class="hero-warn" id="heroWarn"></div>
    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="730" value="0" aria-label="Дата прогноза">
      <div class="scale" id="scale"></div>
    </div>
  </header>

  <section id="tab-cal">
    <div class="cal-head">
      <button class="icon-btn" id="prevM" aria-label="Предыдущий месяц">‹</button>
      <h2 id="monthTitle"></h2>
      <button class="icon-btn" id="nextM" aria-label="Следующий месяц">›</button>
    </div>
    <div class="wd"><span>пн</span><span>вт</span><span>ср</span><span>чт</span><span>пт</span><span>сб</span><span>вс</span></div>
    <div class="grid" id="grid"></div>
    <div class="day" id="day"></div>
  </section>

  <section id="tab-accs" hidden></section>
  <section id="tab-rules" hidden></section>
  <section id="tab-stats" hidden></section>
  <section id="tab-more" hidden></section>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="cal" class="on"><span>📅</span>Календарь</button>
  <button data-tab="accs"><span>💼</span>Счета</button>
  <button data-tab="rules"><span>🔁</span>Регулярные</button>
  <button data-tab="stats"><span>📊</span>Расходы</button>
  <button data-tab="more"><span>⚙️</span>Ещё</button>
</nav>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet-body" id="sheetBody" role="dialog" aria-modal="true"></div>
</div>

<script>
/* ================== Telegram ================== */
const tg = window.Telegram && window.Telegram.WebApp;
const inTg = !!(tg && tg.initData);
if (tg) {
  tg.ready(); tg.expand();
  if (inTg) document.documentElement.classList.add('tg');
}
const haptic = (t='selection') => { try {
  if (!inTg) return;
  if (t==='selection') tg.HapticFeedback.selectionChanged();
  else tg.HapticFeedback.notificationOccurred(t);
} catch(e){} };

/* ================== Даты ================== */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const diffDays = (a, b) => Math.round((parse(a) - parse(b)) / 864e5);
const daysInMonth = (y, m) => new Date(y, m+1, 0).getDate();
const ymKey = (y, m) => `${y}-${pad(m+1)}`;
const today = () => iso(new Date());
const MONTH_IN  = ['январе','феврале','марте','апреле','мае','июне','июле','августе','сентябре','октябре','ноябре','декабре'];
const MONTH_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const fmtDate = (s, opts={day:'numeric', month:'long'}) => parse(s).toLocaleDateString('ru-RU', opts);
let BASE = 'BYN';    // основная валюта (S.settings.base): в ней считаются остаток, прогноз и статистика
// k — сколько единиц показывать в строке курса (100 ₽ удобнее, чем 1 ₽)
const FX = { BYN:{s:'BYN'}, USD:{s:'$'}, EUR:{s:'€'}, RUB:{s:'₽', k:100}, PLN:{s:'zł'}, CNY:{s:'¥'} };
const fmtNum = (n, d=0) => new Intl.NumberFormat('ru-RU', {maximumFractionDigits: d}).format(n);
const curSign = (c = BASE) => (FX[c] || {s: c}).s;
const fmtMoney = n => fmtNum(n, 2) + ' ' + curSign();
const fmtCur = (n, cur) => fmtNum(n, 2) + ' ' + (FX[cur || BASE] || {s: cur}).s;
const fmtSigned = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtMoney(Math.abs(n));
const compact = n => {
  const a = Math.abs(n), s = n < 0 ? '−' : '';
  if (a >= 1e6) return s + (a/1e6).toFixed(a >= 1e7 ? 0 : 1).replace('.', ',') + 'м';
  if (a >= 1e5) return s + Math.round(a/1e3) + 'к';
  if (a >= 1e3) return s + (Math.round(a/100)/10).toString().replace('.', ',') + 'к';
  return s + Math.round(a);
};
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ================== Справочники ================== */
const KINDS = {
  salary:  {name:'Зарплата',        icon:'💰', sign: 1},
  advance: {name:'Аванс',           icon:'💵', sign: 1},
  income:  {name:'Другой доход',    icon:'➕', sign: 1},
  rent:    {name:'Аренда квартиры', icon:'🏠', sign:-1, util:true},  // util — можно добавить примерную коммуналку
  sub:     {name:'Регулярный платёж', icon:'🔁', sign:-1},
};
// Популярные статьи расходов. Ключи старых категорий не менялись — прежние записи остаются на месте.
const CATS = {
  food:{n:'Продукты',i:'🛒'}, cafe:{n:'Кафе и рестораны',i:'☕'}, delivery:{n:'Доставка еды',i:'🍕'},
  transport:{n:'Транспорт',i:'🚌'}, taxi:{n:'Такси',i:'🚕'}, car:{n:'Авто и топливо',i:'⛽'},
  util:{n:'Коммуналка',i:'💡'}, comm:{n:'Связь и интернет',i:'📶'}, subs:{n:'Подписки',i:'📺'},
  home:{n:'Дом',i:'🏡'}, shop:{n:'Покупки',i:'🛍️'}, clothes:{n:'Одежда и обувь',i:'👕'},
  health:{n:'Здоровье',i:'💊'}, beauty:{n:'Красота',i:'💇'}, sport:{n:'Спорт',i:'🏋️'},
  fun:{n:'Развлечения',i:'🎉'}, travel:{n:'Путешествия',i:'✈️'}, gifts:{n:'Подарки',i:'🎁'},
  edu:{n:'Образование',i:'📚'}, kids:{n:'Дети',i:'🧸'}, pets:{n:'Животные',i:'🐾'},
  credit:{n:'Кредиты',i:'🏦'}, other:{n:'Другое',i:'📦'}, plan:{n:'Планируемая покупка',i:'🎯'},
};
const CAT_ICONS = ['🛒','🍔','🍺','🚬','🎮','🎬','🎵','📖','🧴','🧹','🔧','🌿','💻','📱','🎨','⚽','🚲','🏍️','🅿️','🧾','💳','🐱','💐','⛪'];
// Свои категории: S.cats = [{id, n, i, archived?}]; скрытые встроенные — S.hiddenCats
const allCats = () => { const o = { ...CATS }; for (const c of S.cats || []) o[c.id] = c; return o; };
const isHiddenCat = k => (S.hiddenCats || []).includes(k) || ((S.cats || []).find(c => c.id === k) || {}).archived;
const catOf = k => allCats()[k] || CATS.other;
const INCOME_CATS = { bonus:{n:'Премия',i:'🎁'}, gift:{n:'Подарок',i:'💝'}, side:{n:'Подработка',i:'🧰'}, inc:{n:'Другой доход',i:'➕'} };
/* Горизонт прогноза: S.settings.horizon месяцев (3–48, по умолчанию 24) → RANGE дней от сегодня */
const HORIZONS = Array.from({length: 46}, (_, i) => i + 3);
let RANGE = 730, scaleFor = null;
const spanLabel = m => m % 12 === 0 ? (m / 12 === 1 ? '1 год' : m / 12 + ' года') : m === 6 ? 'полгода' : m + ' мес.';
const daysAhead = m => { const t = parse(today()), d = new Date(t.getFullYear(), t.getMonth() + m, 1);
  d.setDate(Math.min(t.getDate(), daysInMonth(d.getFullYear(), d.getMonth()))); return diffDays(iso(d), today()); };
function applyHorizon(){
  const h = S.settings.horizon || 24;
  RANGE = daysAhead(h);
  slider.max = RANGE;
  if (scaleFor === h + today()) return;
  scaleFor = h + today();
  // отметки под ползунком: «сегодня», две «круглые» точки до середины горизонта и конец
  const nice = [1, 2, 3, 6, 12, 18, 24].filter(m => m <= h / 2 && (h < 36 || m % 12 === 0)).slice(-2);
  $('scale').innerHTML = `<button data-jump="0">сегодня</button>` +
    [...nice, h].map(m => `<button data-jump="${daysAhead(m)}">+${spanLabel(m)}</button>`).join('');
}

/* ================== Хранилище ================== */
// В Telegram данные хранятся в CloudStorage пользователя (до 1024 ключей по 4096 символов),
// поэтому состояние режется на куски. Чтобы обрыв связи посреди записи не испортил данные,
// есть два слота — a_* и b_*. Новая версия пишется в неактивный слот, и только когда все куски
// записаны, указатель `ptr` переключается на него. Предыдущая версия всё это время остаётся целой.
// Вне Telegram — localStorage (для теста в браузере).
const CHUNK = 3500;
const SLOTS = ['a', 'b'];
const otherSlot = s => s === 'a' ? 'b' : 'a';
function cs(method, ...args){
  return new Promise((res, rej) => tg.CloudStorage[method](...args, (err, val) => err ? rej(err) : res(val)));
}
const useCloud = () => inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9');

let activeSlot = null;          // слот с последней целой версией
let slotSize = { a: 0, b: 0 };  // сколько кусков лежит в каждом слоте (чтобы удалять лишние)
let legacyN = 0;                // куски старого формата st_* — удаляются после первого сохранения
let LOAD_FAILED = false;        // загрузить не удалось → запись запрещена, чтобы не затереть данные пустыми

// Читает слот; null — если слот пустой или повреждён. Сетевая ошибка пробрасывается наверх.
async function readChunks(prefix, n, len){
  if (!n) return null;
  const keys = Array.from({length:n}, (_, i) => prefix + '_' + i);
  const vals = await cs('getItems', keys);
  const json = keys.map(k => vals[k] || '').join('');
  if (len && json.length !== len) return null;
  try { const st = JSON.parse(json); return st && st.v ? st : null; } catch(e){ return null; }
}

async function loadState(){
  if (API && inTg){
    const shared = await loadShared();
    if (shared !== undefined) return shared;
  }
  if (!useCloud()){
    try { const s = localStorage.getItem('money_state'); return s ? JSON.parse(s) : null; }
    catch(e){ console.error(e); LOAD_FAILED = true; return null; }
  }
  try {
    const meta = await cs('getItems', ['ptr', 'a_n', 'b_n', 'st_n']);
    const info = {};
    for (const s of SLOTS){
      const [n, len] = String(meta[s + '_n'] || '').split('|').map(Number);
      info[s] = { n: n || 0, len: len || 0 };
      slotSize[s] = n || 0;
    }
    legacyN = Number(meta.st_n) || 0;
    const ptr = SLOTS.includes(meta.ptr) ? meta.ptr : null;
    if (ptr){
      // Сначала активный слот; если он повреждён — предыдущая версия из второго
      for (const s of [ptr, otherSlot(ptr)]){
        const st = await readChunks(s, info[s].n, info[s].len);
        if (st){ activeSlot = s; return st; }
      }
    }
    if (legacyN){
      const st = await readChunks('st', legacyN, 0);
      if (st) return st;
    }
    // Данные в облаке есть, но прочитать их не вышло — это не «новый пользователь»
    if (ptr || legacyN) LOAD_FAILED = true;
    return null;
  } catch(e){ console.error(e); LOAD_FAILED = true; return null; }
}

let saveTimer = null, saveChain = Promise.resolve();
function saveState(){
  if (LOAD_FAILED) return;
  if (SHARED) stampAuthors();
  savePriv();
  clearTimeout(saveTimer);
  // Сохранения выстраиваются в очередь, чтобы две записи не писали в один слот одновременно
  saveTimer = setTimeout(() => { saveChain = saveChain.then(writeState); }, 300);
}
async function writeState(){
  if (SHARED) return writeShared();
  const json = JSON.stringify(S);
  try {
    if (!useCloud()){ localStorage.setItem('money_state', json); return true; }
    const slot = activeSlot ? otherSlot(activeSlot) : 'a';
    const parts = [];
    for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    await cs('setItem', slot + '_n', '0');                                  // слот «в работе»
    await Promise.all(parts.map((p, i) => cs('setItem', slot + '_' + i, p)));
    await cs('setItem', slot + '_n', parts.length + '|' + json.length);     // слот целый
    await cs('setItem', 'ptr', slot);                                       // фиксация новой версии
    activeSlot = slot;
    // Уборка: лишние куски этого слота и старый формат. Ошибка здесь данным не вредит.
    const stale = [];
    for (let i = parts.length; i < slotSize[slot]; i++) stale.push(slot + '_' + i);
    slotSize[slot] = parts.length;
    if (legacyN){ for (let i = 0; i < legacyN; i++) stale.push('st_' + i); stale.push('st_n'); legacyN = 0; }
    if (stale.length) await cs('removeItems', stale).catch(console.error);
    return true;
  } catch(e){ console.error(e); toast('Не удалось сохранить. Проверьте интернет.'); return false; }
}

async function loadFailed(){
  const retry = await ask('Не удалось загрузить данные' + (flag.get() ? ' с сервера общего календаря' : ' из облака Telegram') + '. Они не потеряны, но пока изменения не сохраняются. Попробовать снова?');
  if (retry) location.reload();
  else toast('Изменения не сохранятся, пока данные не загрузятся');
}

/* ================== Общий календарь ================== */
// Если в адресе есть ?api=<https-адрес server.py> (его добавляет bot.py), можно завести общий календарь на двоих.
// Тогда состояние S лежит на сервере целиком, одним JSON, с номером версии REV. Запись принимается, только если
// REV не устарел; иначе сервер отвечает 409 с актуальным состоянием, и merge3 сливает чужие и свои правки.
// Автор записи — поле `by` (id в Telegram) у ops, rules и ov. Профили (имя, фото) приходят с сервера в MEMBERS.
const URLQ = new URLSearchParams(location.search);
const API = (URLQ.get('api') || '').replace(/\/+$/, '');
const JOIN = URLQ.get('join');
let LOCKED = false;   // сервер ответил 403: этого пользователя нет в списке допущенных
let SHARED = false, REV = 0, SYNCED = '', MEMBERS = [], ME = 0, writing = false;
const flag = {   // «этот пользователь в общем календаре» — чтобы при недоступном сервере не открыть личный
  get(){ try { return localStorage.getItem('money_shared') === '1'; } catch(e){ return false; } },
  set(v){ try { v ? localStorage.setItem('money_shared', '1') : localStorage.removeItem('money_shared'); } catch(e){} },
};
async function api(method, body){
  const r = await fetch(API + '/api/' + method, { method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ initData: tg.initData, ...body }) });
  let data = null; try { data = await r.json(); } catch(e){}
  return { status: r.status, data: data || {} };
}
function enterShared(d){ SHARED = true; ME = d.me; REV = d.rev; MEMBERS = d.members || []; flag.set(true); }

// Состояние общего календаря; undefined — пользователь не в общем календаре, работаем как раньше
async function loadShared(){
  try {
    let r = await api('me', {});
    if (r.status === 200 && JOIN){
      if (r.data.member) toast('Вы уже состоите в общем календаре');
      else if (await ask('Присоединиться к общему календарю? Ваши личные данные в Telegram останутся нетронутыми, но вместо них будет открываться общий календарь.')){
        const j = await api('join', { token: JOIN });
        if (j.status === 200) r = j;
        else toast(j.data.error === 'full' ? 'В этом календаре уже двое' : j.data.error === 'already_member' ? 'Вы уже состоите в другом общем календаре' : 'Приглашение недействительно');
      }
      try { history.replaceState(null, '', location.pathname + '?api=' + encodeURIComponent(API)); } catch(e){}
    }
    if (r.status === 403){ LOCKED = true; LOAD_FAILED = true; return null; }
    if (r.status !== 200) throw new Error('api ' + r.status);
    if (!r.data.member){ flag.set(false); return undefined; }
    enterShared(r.data); SYNCED = JSON.stringify(r.data.state);
    await loadPriv();
    return r.data.state;
  } catch(e){
    console.error(e);
    if (flag.get()){ LOAD_FAILED = true; return null; }
    return undefined;
  }
}

function lockScreen(){
  document.body.innerHTML = '<div class="lock"><b>🔒</b><h2>Закрытый бот</h2><p>Это приложение доступно только приглашённым пользователям.</p></div>';
}

/* ---------- Личные (инкогнито) записи и личные копилки ----------
   Лежат только в облаке Telegram самого пользователя (ключи с префиксами pa, pb и pptr: те же два слота, что у основных данных)
   и НИКОГДА не попадают в S, а значит, и на сервер. Вне Telegram — localStorage['money_priv'].
   Они не меняют общий остаток: это траты и доходы личного счёта 'me'. Личные копилки (PRIV.accounts) и переводы
   между личными счетами (PRIV.ops с cat:'move') тоже здесь. */
let PRIV = { v: 1, ops: [], accounts: [] }, PRIV_SAVED = '', PRIV_FAILED = false, privActive = null, privSize = { a: 0, b: 0 };
const allOps = () => [...S.ops, ...PRIV.ops];
async function loadPriv(){
  PRIV = { v: 1, ops: [], accounts: [] }; PRIV_SAVED = '';
  try {
    let st = null;
    if (!useCloud()){ const raw = localStorage.getItem('money_priv'); st = raw ? JSON.parse(raw) : null; }
    else {
      const meta = await cs('getItems', ['pptr', 'pa_n', 'pb_n']);
      const info = {};
      for (const sl of SLOTS){ const [n, len] = String(meta['p' + sl + '_n'] || '').split('|').map(Number); info[sl] = { n: n || 0, len: len || 0 }; privSize[sl] = n || 0; }
      if (SLOTS.includes(meta.pptr)){
        for (const sl of [meta.pptr, otherSlot(meta.pptr)]){
          st = await readChunks('p' + sl, info[sl].n, info[sl].len);
          if (st){ privActive = sl; break; }
        }
        if (!st) throw new Error('private data unreadable');   // данные есть, но не читаются — не затираем
      }
    }
    if (st && Array.isArray(st.ops)){ PRIV = st; PRIV.accounts = PRIV.accounts || []; PRIV_SAVED = JSON.stringify(PRIV); }
  } catch(e){ console.error(e); PRIV_FAILED = true; toast('Не удалось загрузить личные записи. Они не изменятся.'); }
}
let privTimer = null, privChain = Promise.resolve();
function savePriv(){
  if (!SHARED || PRIV_FAILED) return;
  clearTimeout(privTimer);
  privTimer = setTimeout(() => {
    const json = JSON.stringify(PRIV);
    if (json !== PRIV_SAVED) privChain = privChain.then(() => writePriv(json));
  }, 300);
}
async function writePriv(json){
  try {
    if (!useCloud()){ localStorage.setItem('money_priv', json); PRIV_SAVED = json; return; }
    const slot = privActive ? otherSlot(privActive) : 'a', pre = 'p' + slot, parts = [];
    for (let i = 0; i < json.length; i += CHUNK) parts.push(json.slice(i, i + CHUNK));
    await cs('setItem', pre + '_n', '0');
    await Promise.all(parts.map((p, i) => cs('setItem', pre + '_' + i, p)));
    await cs('setItem', pre + '_n', parts.length + '|' + json.length);
    await cs('setItem', 'pptr', slot);
    privActive = slot; PRIV_SAVED = json;
    const stale = [];
    for (let i = parts.length; i < privSize[slot]; i++) stale.push(pre + '_' + i);
    privSize[slot] = parts.length;
    if (stale.length) await cs('removeItems', stale).catch(console.error);
  } catch(e){ console.error(e); toast('Не удалось сохранить личные записи. Проверьте интернет.'); }
}

// Трёхстороннее слияние по id: base — версия, с которой я начал, mine — моя, theirs — на сервере.
// То, что менял я, берётся моё (в том числе удаление), всё остальное — серверное.
function merge3(base, mine, theirs){
  const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  const pick = (b, m, t) => same(m, b) ? t : m;
  const out = { ...theirs };
  for (const k of ['ops', 'rules', 'accounts', 'cats']){
    const B = new Map((base[k] || []).map(x => [x.id, x]));
    const res = new Map((theirs[k] || []).map(x => [x.id, x]));
    for (const x of mine[k] || []) if (!same(B.get(x.id), x)) res.set(x.id, x);
    const M = new Set((mine[k] || []).map(x => x.id));
    for (const id of B.keys()) if (!M.has(id)) res.delete(id);
    out[k] = [...res.values()];
  }
  const ov = { ...(theirs.ov || {}) };
  for (const key of new Set([...Object.keys(base.ov || {}), ...Object.keys(mine.ov || {})])){
    const b = (base.ov || {})[key], m = (mine.ov || {})[key];
    if (same(b, m)) continue;
    if (m === undefined) delete ov[key]; else ov[key] = m;
  }
  out.ov = ov;
  const bh = base.hiddenCats || [], mh = mine.hiddenCats || [];
  out.hiddenCats = [...new Set([...(theirs.hiddenCats || []), ...mh.filter(x => !bh.includes(x))])]
    .filter(x => !(bh.includes(x) && !mh.includes(x)));
  out.start = pick(base.start, mine.start, theirs.start);
  out.settings = { ...theirs.settings };
  for (const k of Object.keys(mine.settings || {})) out.settings[k] = pick((base.settings || {})[k], mine.settings[k], (theirs.settings || {})[k]);
  const fm = mine.fx, ft = theirs.fx;   // курс: тот, что свежее
  out.fx = !ft ? fm : !fm ? ft : String(fm.checked || fm.date) > String(ft.checked || ft.date) ? fm : ft;
  return out;
}

function adoptRemote(d){
  S = normalizeState(merge3(JSON.parse(SYNCED), S, d.state));
  REV = d.rev; SYNCED = JSON.stringify(d.state); MEMBERS = d.members || MEMBERS;
  BASE = S.settings.base;
  renderAll();
}

async function writeShared(){
  writing = true;
  try {
    for (let attempt = 0; attempt < 4; attempt++){
      const json = JSON.stringify(S);
      if (json === SYNCED) return true;
      const r = await api('save', { rev: REV, state: S });
      if (r.status === 200){ REV = r.data.rev; SYNCED = json; return true; }
      if (r.status === 409 && r.data.error === 'conflict'){ adoptRemote(r.data); continue; }
      throw new Error('save ' + r.status);
    }
  } catch(e){ console.error(e); toast('Не удалось сохранить. Проверьте интернет.'); }
  finally { writing = false; }
  return false;
}

// Раз в 15 секунд (и при возвращении в приложение) подтягиваем правки второго участника
async function pollShared(){
  if (!SHARED || LOAD_FAILED || writing || document.hidden || !$('sheet').hidden) return;
  if (JSON.stringify(S) !== SYNCED){ saveState(); return; }       // прошлая запись не удалась — повторяем
  try {
    const r = await api('me', { since: REV });
    if (r.status !== 200 || !r.data.member) return;
    MEMBERS = r.data.members;
    if (r.data.state && r.data.rev > REV && !writing && JSON.stringify(S) === SYNCED) adoptRemote(r.data);
  } catch(e){ console.error(e); }
}
setInterval(pollShared, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollShared(); });

// Автор записей: без отметки остаются только записи, сделанные до перехода на общий календарь
function stampAuthors(by = ME){
  for (const o of S.ops) if (!o.by) o.by = by;
  for (const r of S.rules) if (!r.by) r.by = by;
  for (const k in S.ov) if (!S.ov[k].by) S.ov[k].by = by;
}
function avatar(id){
  const m = MEMBERS.find(x => x.id === id); if (!m) return '';
  return m.photo ? `<img class="av" src="${esc(m.photo)}" alt="" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
                 : `<span class="av">${esc([...m.name][0] || '?')}</span>`;
}
const who = x => { const m = SHARED && x.by && MEMBERS.find(m => m.id === x.by); return m ? `<span class="by">${avatar(m.id)}${esc(m.name.split(' ')[0])}</span>` : ''; };

/* ================== Состояние ================== */
let S = null;          // данные пользователя
let EV = new Map();    // дата -> события
let BAL = new Map();   // дата -> остаток на конец дня
let SEL = today();     // выбранный день
let VIEW = {y: new Date().getFullYear(), m: new Date().getMonth()}; // открытый месяц
let SM = {y: new Date().getFullYear(), m: new Date().getMonth()};   // месяц на вкладке «Расходы»

// загруженный курс переносится в новое состояние (онбординг, сброс), чтобы не качать его заново
const blankState = () => ({ v:1, start:{date:today(), balance:0, ts:Date.now()}, rules:[], ov:{}, ops:[], accounts:[], cats:[], hiddenCats:[], settings:{shift:false, base: S && S.settings && S.settings.base || 'BYN', horizon: S && S.settings && S.settings.horizon || 24}, fx: S && S.fx || undefined });

// Недостающие поля старых версий данных
function normalizeState(s){
  s.settings = s.settings || { shift: false }; s.settings.base = s.settings.base || 'BYN';
  s.ov = s.ov || {}; s.ops = s.ops || []; s.rules = s.rules || []; s.accounts = s.accounts || []; s.cats = s.cats || []; s.hiddenCats = s.hiddenCats || [];
  return s;
}

/* ================== Курсы валют ================== */
// В S.fx.rates лежит, сколько BYN стоит 1 единица валюты (так отдаёт НБРБ). Для другой основной валюты
// курс считается кросс-курсом через BYN. Курс хранится в данных, поэтому без сети работает последний известный.
// Регулярные суммы в валюте пересчитываются по текущему курсу, прошедшие операции — по курсу,
// зафиксированному в op.rate (официальный курс НБРБ на дату операции, см. freezeOps).
let FX_MISSING = false;
const bynRate = c => c === 'BYN' ? 1 : (S.fx && S.fx.rates[c]) || null;
const cross = (from, to) => { const a = bynRate(from), b = bynRate(to); return a && b ? a / b : null; };  // сколько `to` за 1 `from`
const rateOf = cur => !cur || cur === BASE ? 1 : cross(cur, BASE);
const toBase = (amount, cur, fixed) => {
  if (!cur || cur === BASE) return amount;
  const r = fixed || rateOf(cur);
  if (!r){ FX_MISSING = true; return 0; }
  return amount * r;
};
const curOpt = c => c && c !== BASE ? { cur: c } : {};
const checkCur = c => {
  if (c === BASE || rateOf(c)) return true;
  toast(`Курс ${c} ещё не загружен — нужен интернет`); return false;
};
const curSelect = (id, val) => `<select id="${id}">${Object.keys(FX).map(c => `<option value="${c}" ${c === (val || BASE) ? 'selected' : ''}>${c}</option>`).join('')}</select>`;
const amtField = (label, id, value, cur, ph='0') =>
  `<label class="field"><span>${label}</span><div class="amt"><input id="${id}" inputmode="decimal" value="${value}" placeholder="${ph}">${curSelect(id + '_c', cur)}</div></label>`;

// Поле «примерная коммуналка» — только для аренды. Своя валюта (ucur), платится в тот же день, что и аренда;
// в календаре и прогнозе переводится в основную валюту, как и все суммы.
const utilField = (val, cur, hidden) =>
  `<label class="field" id="f_u_w"${hidden ? ' hidden' : ''}><span>💡 Коммуналка, примерно</span><div class="amt"><input id="f_u" inputmode="decimal" value="${val || ''}" placeholder="0">${curSelect('f_u_c', cur)}</div></label>`;
const readUtil = el => { const u = num(el ? el.value : ''); return u > 0 ? u : 0; };
const utilOpt = (u, c) => u > 0 ? { util: u, ...(c && c !== BASE ? { ucur: c } : {}) } : {};

async function getJSON(url){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 8000);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
// Только официальный курс Нацбанка РБ (https://www.nbrb.by/apihelp/exrates).
// GET .../exrates/rates?periodicity=0 — все ежедневные курсы на сегодня; &ondate=ГГГГ-ММ-ДД — на дату.
// В ответе: Cur_Abbreviation, Cur_Scale (за сколько единиц), Cur_OfficialRate (BYN), Date.
// Два адреса — один и тот же API НБРБ (основной и на nbrb.by).
const NBRB = ['https://api.nbrb.by/exrates/rates', 'https://www.nbrb.by/api/exrates/rates'];
async function nbrbRates(ondate){
  const want = Object.keys(FX).filter(c => c !== 'BYN');
  for (const base of NBRB){
    try {
      const list = await getJSON(base + '?periodicity=0' + (ondate ? '&ondate=' + ondate : ''));
      const rates = {};
      for (const x of list) if (want.includes(x.Cur_Abbreviation)) rates[x.Cur_Abbreviation] = x.Cur_OfficialRate / x.Cur_Scale;
      if (Object.keys(rates).length) return { rates, date: String(list[0].Date).slice(0, 10) };
    } catch(e){ console.warn('НБРБ', base, ondate || '', e); }
  }
  return null;
}
const fetchRates = async () => { const r = await nbrbRates(); return r && { ...r, src: 'Нацбанк РБ' }; };

function choose(msg, buttons){

/* Смена основной валюты */
async function changeBase(nb){
  const ob = BASE;
  if (nb === ob) return;
  const k = cross(ob, nb);  // сколько nb за 1 ob
  if (!k){ toast('Сначала нужно загрузить курс — проверьте интернет'); renderMore(); return; }
  const mode = await choose(`Основная валюта: ${ob} → ${nb}. Что сделать с суммами, которые сейчас в ${ob}?`, [
    { id: 'conv',  type: 'default', text: `Пересчитать в ${nb} по курсу` },
    { id: 'label', type: 'default', text: 'Оставить числа, сменить только валюту' },
    { id: 'cancel', type: 'cancel' },
  ]);
  if (mode !== 'conv' && mode !== 'label'){ renderMore(); return; }
  const t = today();
  // Зафиксированные курсы валютных операций — рыночный факт, их переводим в новую валюту в любом случае
  for (const op of allOps()) if (op.cur && op.rate) op.rate *= k;
  if (mode === 'conv'){
    // Суммы без валюты были в старой основной — делаем это явным, и они пересчитаются в новую
    S.start.balance *= k;
    for (const op of allOps()) if (!op.cur){ op.cur = ob; if (op.date <= t) op.rate = k; }
    for (const r of S.rules) for (const v of r.v){ if (!v.cur && !v.stop) v.cur = ob; if (v.util && !v.ucur) v.ucur = ob; }
    for (const o of Object.values(S.ov)){ if (o.amount != null && !o.cur) o.cur = ob; if (o.util && !o.ucur) o.ucur = ob; }
  }
  // Суммы, которые и так были в новой валюте, становятся «основными»
  for (const op of allOps()) if (op.cur === nb){ delete op.cur; delete op.rate; delete op.rdate; }
  for (const r of S.rules) for (const v of r.v){ if (v.cur === nb) delete v.cur; if (v.ucur === nb) delete v.ucur; }
  for (const o of Object.values(S.ov)){ if (o.cur === nb) delete o.cur; if (o.ucur === nb) delete o.ucur; }
  for (const op of allOps()) if (op.cur) delete op.rdate;   // курс на дату уточнится уже к новой валюте
  S.settings.base = nb;
  haptic('success'); commit(); toast('Основная валюта: ' + nb);
  freezeOps();
}

/* Прошедшие операции в валюте фиксируются по официальному курсу НБРБ на дату операции (op.rdate — на какую
   дату получен op.rate). Пока такой курс не загружен, используется текущий, и при следующем запуске будет новая попытка. */
const RATES_ON = new Map();   // кэш курсов по датам на время сессии
let freezing = false;
async function freezeOps(){
  if (LOAD_FAILED || freezing) return;
  freezing = true;
  try {
    const t = today(); let changed = false;
    const todo = allOps().filter(op => op.cur && op.cur !== BASE && op.date <= t && op.rdate !== op.date);
    for (const op of todo) if (!op.rate && rateOf(op.cur)){ op.rate = rateOf(op.cur); changed = true; }
    // не больше 30 дат за раз, чтобы не заваливать API запросами; остальные — при следующем запуске
    for (const d of [...new Set(todo.map(op => op.date))].slice(0, 30)){
      if (!RATES_ON.has(d)){ const r = await nbrbRates(d); if (r) RATES_ON.set(d, r.rates); }
      const r = RATES_ON.get(d); if (!r) continue;
      const bb = BASE === 'BYN' ? 1 : r[BASE];
      for (const op of todo) if (op.date === d){
        const a = op.cur === 'BYN' ? 1 : r[op.cur];
        if (a && bb){ op.rate = a / bb; op.rdate = d; changed = true; }
      }
    }
    if (changed) commit();
  } finally { freezing = false; }
}
async function refreshRates(force){
  if (LOAD_FAILED) return;
  if (!force && S.fx && S.fx.checked === today()) return;
  const fx = await fetchRates();
  if (!fx){ if (force) toast('Нацбанк РБ не ответил. Используется последний загруженный курс.'); return; }
  S.fx = { ...fx, rates: { ...(S.fx && S.fx.rates), ...fx.rates }, checked: today() };
  commit();
  if (force) toast('Курс обновлён');
}

// S.accounts — дополнительные счета (копилки): {id, name, icon, archived?}. Основной счёт ('main') — это и есть
// остаток и прогноз в шапке. Перевод — операция cat:'move' с полями from/to: 'main', id счёта или 'ext'
// (деньги извне — например, уже отложенное при создании счёта). Перевод не считается ни расходом, ни доходом.
const ACC_ICONS = ['🏖','🏠','🚗','✈️','🎁','💍','🎓','🩺','📱','💻','🛋','👶','🐶','🎮','🐷','🛟'];
// Копилки: общие (S.accounts) и мои личные (PRIV.accounts, видны только мне). Личный счёт 'me' и личные копилки —
// «личная сторона». Перевод целиком между личными сторонами (или 'ext') хранится в PRIV и партнёру не виден;
// перевод между личной и общей стороной лежит в S.ops: партнёр видит сумму и «Личный (Имя)», но не название копилки.
const allAccs = () => [...(S.accounts || []), ...(PRIV.accounts || [])];
const accList = all => allAccs().filter(a => all || !a.archived);
const accById = id => allAccs().find(a => a.id === id);
const privSide = id => id === 'me' || (PRIV.accounts || []).some(a => a.id === id);
const isPrivMove = (from, to) => (privSide(from) || privSide(to)) && [from, to].every(x => privSide(x) || x === 'ext');
const pushMove = op => (isPrivMove(op.from, op.to) ? PRIV : S).ops.push(op);
const foreignPriv = op => !!op.by && op.by !== ME && [op.from, op.to].some(id => id === 'me' || (id !== 'main' && id !== 'ext' && !accById(id)));
// 'me' — личный счёт того, кто сделал запись (by). Перевод на него виден обоим, траты с него (инкогнито) — только владельцу
const meLabel = by => '🕶️ Личный' + (by && by !== ME ? ' (' + ((MEMBERS.find(m => m.id === by) || {}).name || '').split(' ')[0] + ')' : '');
const accLabel = (id, by) => id === 'main' ? '💳 Основной' : id === 'ext' ? '➕ Извне' : id === 'me' ? meLabel(by) : (a => a ? a.icon + ' ' + a.name : by && by !== ME ? meLabel(by) : '❔ Удалённый счёт')(accById(id));
const isMove = e => e.op && e.op.cat === 'move';
const moveBase = op => toBase(op.amount, op.cur, op.rate);
// Остаток счёта на конец дня d (skip — операцию не учитывать, нужно при её правке)
function accBal(id, d, skip){
  let b = 0;
  const add = op => { if (op.cat === 'move' && op !== skip && op.date <= d){ const v = moveBase(op); if (op.to === id) b += v; if (op.from === id) b -= v; } };
  for (const op of S.ops){ if (id === 'me' && op.by !== ME) continue; add(op); }   // переводы на чужой личный счёт — не мои
  for (const op of PRIV.ops){
    add(op);
    if (id === 'me' && op.cat !== 'move' && op !== skip && op.date <= d) b += toBase(op.amount, op.cur, op.rate);
  }
  return b;
}
const firstGrapheme = s => {
  if (!s) return '';
  try { if (Intl.Segmenter){ const it = new Intl.Segmenter('ru', {granularity: 'grapheme'}).segment(s)[Symbol.iterator]().next(); if (!it.done) return it.value.segment; } } catch(e){}
  return Array.from(s).slice(0, 4).join('');
};

/* Версия правила, действующая в месяце ym */
function versionFor(rule, ym){
  let best = null;
  for (const v of rule.v) if (v.from <= ym && (!best || v.from > best.from)) best = v;
  return best;
}
/* Начисление/платёж по правилу в месяце (y, m) */
function occurrence(rule, y, m){
  const ym = ymKey(y, m);
  const v = versionFor(rule, ym);
  if (!v || v.stop) return null;
  const o = S.ov[rule.id + '|' + ym];
  if (o && o.skip) return null;
  const amount = o && o.amount != null ? o.amount : v.amount;
  const cur = (o && o.amount != null ? o.cur : v.cur) || BASE;
  const src = o && o.amount != null ? o : v;   // откуда брать коммуналку: правка месяца или версия правила
  const util = KINDS[rule.kind].util ? src.util || 0 : 0;
  const ucur = src.ucur || BASE;
  const day = o && o.day != null ? o.day : v.day;
  // 31-е (или 30-е, 29-е) в коротком месяце -> последний день месяца
  const d = new Date(y, m, Math.min(day, daysInMonth(y, m)));
  const sign = KINDS[rule.kind].sign;
  if (S.settings.shift && sign > 0){
    const wd = d.getDay();
    if (wd === 6) d.setDate(d.getDate() - 1);
    if (wd === 0) d.setDate(d.getDate() - 2);
  }
  const ub = sign * toBase(util, ucur);
  return { date: iso(d), amount: sign * toBase(amount, cur) + ub, util: ub, orig: { amount, cur, util, ucur }, rule, ym, day, changed: !!o };
}
function counts(e){
  const sd = S.start.date;
  if (e.rule) return e.date > sd;
  if (e.op.date > sd) return true;
  if (e.op.date === sd) return (e.op.ts || 0) > (S.start.ts || 0);
  return false;
}
function rebuild(){
  BASE = S.settings.base || 'BYN';
  applyHorizon();
  EV = new Map(); BAL = new Map(); FX_MISSING = false;
  const t = today();
  const from = [S.start.date, addDays(t, -400)].sort()[0];
  const to = addDays(t, RANGE);
  const push = e => { if (!EV.has(e.date)) EV.set(e.date, []); EV.get(e.date).push(e); };
  let d = parse(from); d.setDate(1); d.setMonth(d.getMonth() - 1);
  const end = parse(to); end.setMonth(end.getMonth() + 1);
  while (d <= end){
    for (const r of S.rules){ const o = occurrence(r, d.getFullYear(), d.getMonth()); if (o) push(o); }
    d.setMonth(d.getMonth() + 1);
  }
  for (const op of S.ops){
    if (op.cat === 'move'){
      // на основном счёте перевод виден только если он в нём участвует
      const v = moveBase(op);
      push({ date: op.date, amount: (op.to === 'main' ? v : 0) - (op.from === 'main' ? v : 0), move: v, op });
    } else push({ date: op.date, amount: toBase(op.amount, op.cur, op.rate), op });
  }
  // Личные записи только показываются в календаре (priv) и не влияют на общий остаток
  if (SHARED) for (const op of PRIV.ops){
    if (op.cat === 'move') push({ date: op.date, amount: 0, move: moveBase(op), op, priv: true });
    else push({ date: op.date, amount: toBase(op.amount, op.cur, op.rate), op, priv: true });
  }
  let b = S.start.balance, cur = S.start.date;
  while (cur <= to){
    for (const e of EV.get(cur) || []) if (!e.priv && counts(e)) b += e.amount;
    BAL.set(cur, b);
    cur = addDays(cur, 1);
  }
}
const balOn = d => BAL.has(d) ? BAL.get(d) : null;

/* Следующий доход после даты */
function nextIncome(after){
  for (let i = 1; i <= 62; i++){
    const d = addDays(after, i);
    const ev = (EV.get(d) || []).filter(e => e.rule && e.amount > 0);
    if (ev.length) return { date: d, days: i, amount: ev.reduce((s, e) => s + e.amount, 0), name: ev.map(e => e.rule.name).join(' + ') };
  }
  return null;
}
/* Первый день ухода в минус */
function firstNegative(){
  const t = today();
  for (let i = 0; i <= RANGE; i++){ const d = addDays(t, i); const b = balOn(d); if (b != null && b < 0) return d; }
  return null;
}
/* Когда можно купить: самый ранний день, после которого остаток нигде не уйдёт ниже суммы+запаса */
function whenCanBuy(amount, buffer){
  const t = today();
  const days = []; for (let i = 0; i <= RANGE; i++) days.push(addDays(t, i));
  let min = Infinity; const suf = new Array(days.length);
  for (let i = days.length - 1; i >= 0; i--){ const b = balOn(days[i]); min = Math.min(min, b == null ? Infinity : b); suf[i] = min; }
  for (let i = 0; i < days.length; i++) if (suf[i] - amount >= buffer) return days[i];
  return null;
}

/* ================== Статистика ================== */
/* ================== Дашборд расходов ================== */
const PALETTE = ['#4a8df0', '#f0a23a', '#3fb27f', '#e0607e', '#8f6ee8', '#2bb3c0', '#d8c33a', '#a0a6b0'];
const ymOf = (y, m) => { const d = new Date(y, m, 1); return { y: d.getFullYear(), m: d.getMonth() }; };
const lastDay = (y, m) => `${y}-${pad(m+1)}-${pad(daysInMonth(y, m))}`;
const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
const monthTitle = (y, m) => new Date(y, m, 1).toLocaleDateString('ru-RU', {month:'long', year:'numeric'});

// Ключ статьи расхода: категория операции или регулярный платёж (по правилу).
// Аренда квартиры (вместе с коммуналкой из неё) и вручную внесённая коммуналка — одна статья 'housing'.
const HOUSING = { n: 'Аренда и коммуналка', i: '🏠' };
const statKey = e => e.rule ? (KINDS[e.rule.kind].util ? 'housing' : 'rule:' + e.rule.id) : e.op.cat === 'util' ? 'housing' : e.op.cat;
function catKeyInfo(k){
  if (k === 'housing') return HOUSING;
  if (k.startsWith('personal:')){ const m = MEMBERS.find(x => x.id === +k.slice(9)); return { n: m ? m.name.split(' ')[0] : 'Личные', i: '🕶️' }; }
  if (k.startsWith('rule:')){ const r = S.rules.find(x => x.id === k.slice(5)); return r ? { n: r.name, i: KINDS[r.kind].icon } : { n: 'Регулярный платёж', i: '🔁' }; }
  return catOf(k);
}
// Общая сторона: основной счёт, «извне» и общие копилки. Всё остальное — личные счета (свои и чужие).
const sharedSide = id => id === 'main' || id === 'ext' || (S.accounts || []).some(a => a.id === id);
function monthStats(y, m){
  const prefix = `${y}-${pad(m+1)}`, t = today();
  const r = { inc: 0, out: 0, outToDate: 0, saved: 0, byCat: {}, items: {} };
  EV.forEach((list, d) => {
    if (!d.startsWith(prefix)) return;
    for (const e of list){
      if (e.priv) continue;                                  // личные траты в общую статистику не входят
      if (isMove(e)){
        const o = e.op;
        if ((o.from === 'main' && !sharedSide(o.to)) || (o.to === 'main' && !sharedSide(o.from))){
          // деньги ушли с общего счёта на личный (или вернулись): это расход «на имя» владельца, а не «отложено»
          const k = 'personal:' + (o.by || 0), v = -e.amount;
          r.out += v; if (d <= t) r.outToDate += v;
          r.byCat[k] = (r.byCat[k] || 0) + v;
          (r.items[k] = r.items[k] || []).push({ e, v, d });
        } else r.saved -= e.amount;      // с основного на общие копилки — «отложено»
        continue;
      }
      if (e.amount > 0){ r.inc += e.amount; continue; }
      const k = statKey(e), v = -e.amount;
      r.out += v; if (d <= t) r.outToDate += v;
      r.byCat[k] = (r.byCat[k] || 0) + v;
      (r.items[k] = r.items[k] || []).push({ e, v, d });
    }
  });
  for (const k of Object.keys(r.byCat)) if (k.startsWith('personal:') && r.byCat[k] <= 0){
    const back = -r.byCat[k]; r.inc += back; r.out += back; r.outToDate = Math.max(0, r.outToDate + back);
    delete r.byCat[k]; delete r.items[k];
  }
  return r;
}
function donutSvg(parts, total){
  let off = 0;
  const segs = parts.map(([, v], i) => {
    const p = v / total * 100, seg = `<circle r="15.915" cx="21" cy="21" fill="none" stroke="${PALETTE[i % PALETTE.length]}" stroke-width="6" stroke-dasharray="${p.toFixed(3)} ${(100 - p).toFixed(3)}" stroke-dashoffset="${(25 - off).toFixed(3)}"/>`;
    off += p; return seg;
  }).join('');
  return `<svg class="donut" viewBox="0 0 42 42" role="img" aria-label="Расходы по категориям">
    <circle r="15.915" cx="21" cy="21" fill="none" stroke="var(--bg)" stroke-width="6"/>${segs}
    <text x="21" y="20" text-anchor="middle" font-size="4.2">${esc(compact(total))}</text>
    <text x="21" y="25" text-anchor="middle" font-size="3" style="fill:var(--hint);font-weight:400">${esc(curSign())}</text></svg>`;
}

function renderStats(){
  const { y, m } = SM, t = today(), tm = t.slice(0, 7), key = `${y}-${pad(m+1)}`;
  const st = monthStats(y, m), pm = ymOf(y, m - 1), prev = monthStats(pm.y, pm.m);
  const kind = key === tm ? 'cur' : key < tm ? 'past' : 'future';

  // Состояние счёта: текущий месяц — сегодня, прошлый — на конец месяца, будущий — прогноз на конец месяца
  const at = kind === 'cur' ? t : lastDay(y, m);
  const main = balOn(at), saveSum = accList().reduce((s, a) => s + accBal(a.id, at), 0);
  const prevEnd = balOn(lastDay(pm.y, pm.m));
  const stateLabel = kind === 'cur' ? 'На основном счёте сейчас' : kind === 'past' ? `На основном счёте на ${fmtDate(at)}` : `Прогноз на ${fmtDate(at)}`;
  const monthEnd = kind === 'cur' ? balOn(lastDay(y, m)) : null;
  const delta = main != null && prevEnd != null ? (kind === 'cur' ? balOn(lastDay(y, m)) : main) - prevEnd : null;

  // Проценты
  const dim = daysInMonth(y, m), passed = kind === 'cur' ? +t.slice(8) : kind === 'past' ? dim : 0;
  const perDay = passed ? (kind === 'cur' ? st.outToDate : st.out) / passed : 0;

  // рост расходов — красный, рост доходов — зелёный

  const rows = Object.entries(st.byCat).sort((a, b) => b[1] - a[1]);
  const donutParts = rows.length > 7 ? [...rows.slice(0, 6), ['__rest', rows.slice(6).reduce((s, r) => s + r[1], 0)]] : rows;
  const color = k => { const i = donutParts.findIndex(r => r[0] === k); return PALETTE[(i < 0 ? donutParts.length - 1 : i) % PALETTE.length]; };

  $('tab-stats').innerHTML = `
    <div class="cal-head">
      <button class="icon-btn" id="sPrev" aria-label="Предыдущий месяц">‹</button>
      <h2>${monthTitle(y, m)}</h2>
      <button class="icon-btn" id="sNext" aria-label="Следующий месяц">›</button>
    </div>
    ${kind !== 'cur' ? '<button class="btn soft block" id="sNow" style="margin:0 0 12px">К текущему месяцу</button>' : ''}

    <div class="dash-card">
      <span class="hint">${stateLabel}</span>
      <b class="big num ${main != null && main < 0 ? 'negc' : ''}">${main != null ? fmtMoney(main) : '—'}</b>
      <span class="hint">${[
        accList().length ? `на счетах-копилках ${fmtMoney(saveSum)} · всего ${fmtMoney((main || 0) + saveSum)}` : '',
        monthEnd != null ? `к концу месяца ≈ ${fmtMoney(monthEnd)}` : '',
        delta != null ? `за месяц ${fmtSigned(delta)}` : '',
        main == null ? 'учёт начинается с ' + fmtDate(S.start.date) : '',
      ].filter(Boolean).join('<br>')}</span>
    </div>

    <div class="kpis">
      <div><span class="hint">Доходы</span><b class="num pos">${fmtMoney(st.inc)}</b><small>${prev.inc ? trend(Math.round((st.inc - prev.inc) / prev.inc * 100), true) : '&nbsp;'}</small></div>
      <div><span class="hint">Расходы</span><b class="num negc">${fmtMoney(st.out)}</b><small>${trend(vsPrev) || '&nbsp;'}</small></div>
      <div><span class="hint">Потрачено от дохода</span><b class="num">${st.inc ? pct(st.out, st.inc) + '%' : '—'}</b><small>${st.inc ? (st.out <= st.inc ? `осталось ${fmtMoney(st.inc - st.out)}` : `перерасход ${fmtMoney(st.out - st.inc)}`) : 'доходов нет'}</small></div>
      <div><span class="hint">В среднем в день</span><b class="num">${passed ? fmtMoney(perDay) : '—'}</b><small>${kind === 'cur' ? `прошло ${passed} из ${dim} дн.` : kind === 'past' ? `${dim} дн. в месяце` : 'месяц ещё не начался'}</small></div>
      ${st.saved ? `<div style="grid-column:1/-1"><span class="hint">Отложено на счета</span><b class="num movec">${fmtMoney(st.saved)}</b><small>${st.inc ? pct(st.saved, st.inc) + '% дохода' : ''}</small></div>` : ''}
    </div>

    ${rows.length ? `

      <div class="donut-wrap">
        ${donutSvg(donutParts, st.out)}
        <div class="legend">${donutParts.map(([k, v], i) => `<div><i style="background:${PALETTE[i % PALETTE.length]}"></i><span>${k === '__rest' ? 'Остальное' : esc(catKeyInfo(k).n)}</span><b class="num">${pct(v, st.out)}%</b></div>`).join('')}</div>
      </div>
    </div>
    <div class="sec-title" style="margin-top:6px">По категориям</div>
    <div class="card">${rows.map(([k, v]) => {
      const c = catKeyInfo(k), pv = prev.byCat[k] || 0;
      const ch = pv ? Math.round((v - pv) / pv * 100) : null;
      return `<div class="crow" data-cat="${esc(k)}">

        <div class="bar"><i style="width:${v / rows[0][1] * 100}%;background:${color(k)}"></i></div>
        <div class="meta"><span>${pct(v, st.out)}% расходов · ${st.items[k].length} ${st.items[k].length === 1 ? 'запись' : st.items[k].length < 5 ? 'записи' : 'записей'}</span>
          <span>${ch == null ? (prev.out ? 'новая статья' : '') : ch === 0 ? '= прошлому' : `<span class="${ch > 0 ? 'up' : 'down'}">${ch > 0 ? '▲' : '▼'} ${Math.abs(ch)}%</span>`}</span></div>

    <button class="btn soft block" id="sCats">🏷️ Категории расходов</button>

  $('sPrev').onclick = () => { SM = ymOf(y, m - 1); haptic(); renderStats(); };

  $('sCats').onclick = () => catManager();
  $('tab-stats').querySelectorAll('[data-cat]').forEach(el => el.onclick = () => catItems(el.dataset.cat, st));
}

      let id;

      else { id = 'c_' + uid(); S.cats.push({ id, n, i }); }
      haptic('success'); commit();
      after ? after(id) : closeSheet();
    };
    const del = b.querySelector('#f_del');
    if (del) del.onclick = async () => {
      if (!(await ask(`Удалить категорию «${c.n}»? Старые записи останутся в статистике под этим названием.`))) return;
      c.archived = true; commit(); after ? after() : closeSheet();
    };
  });
}

/* Расход / доход за день */
/* Категории расходов в порядке «популярности»: сначала самые частые за последние 90 дней, затем остальные */
function sortedExpenseCats(keep){
  const since = addDays(today(), -90), used = {};
  for (const op of S.ops) if (op.amount < 0 && op.cat !== 'move' && op.date >= since) used[op.cat] = (used[op.cat] || 0) + 1;
  const all = allCats(), keys = Object.keys(all).filter(k => k === keep || (!isHiddenCat(k) && k !== 'plan'));
  const order = Object.keys(all);
  keys.sort((a, b) => (used[b] || 0) - (used[a] || 0) || order.indexOf(a) - order.indexOf(b));
  if (keep === 'plan' || used.plan) keys.push('plan');
  return [...new Set(keys)].map(k => [k, all[k]]);
}
function editOp(op, sign, draft){
  const isNew = !op; sign = op ? Math.sign(op.amount) : sign;
  const wasPriv = !!op && PRIV.ops.includes(op);
  const d = draft || (op ? { amount: Math.abs(op.amount), cur: op.cur, cat: op.cat, date: op.date, note: op.note, inc: wasPriv } : {});
  const cats = sign < 0 ? sortedExpenseCats(d.cat) : Object.entries(INCOME_CATS);
  const cur = d.cat || cats[0][0];
  openSheet(`
    <h2>${isNew ? (sign < 0 ? 'Новый расход' : 'Новый доход') : 'Изменить запись'}</h2>
    ${amtField('Сумма', 'f_a', d.amount || '', d.cur || BASE)}
    <div class="chips">${cats.map(([k, c]) => `<label><input type="radio" name="cat" value="${k}" ${k === cur ? 'checked' : ''}>${esc(c.i)} ${esc(c.n)}</label>`).join('')}${sign < 0 ? '<label id="f_newcat" style="color:var(--accent)">＋ Своя</label>' : ''}</div>
    <label class="field"><span>Дата</span><input id="f_d" type="date" value="${d.date || SEL}"></label>
    <label class="field"><span>Комментарий</span><input id="f_n" value="${esc(d.note || '')}" placeholder="необязательно"></label>
    ${SHARED ? `<label class="switch"><span>🕶️ Инкогнито<br><small class="hint">Видно только вам, считается с личного счёта, общий остаток не меняется</small></span><input type="checkbox" id="f_inc" ${d.inc ? 'checked' : ''}></label>` : ''}
    <button class="btn block" id="f_save">${isNew ? 'Добавить' : 'Сохранить'}</button>
    ${isNew ? '' : '<button class="btn danger block" id="f_del">Удалить</button>'}`,
  b => {
    // «＋ Своя»: создаём категорию и возвращаемся в эту же форму с уже введёнными данными
    const nc = b.querySelector('#f_newcat');
    if (nc) nc.onclick = () => {
      const keep = { amount: b.querySelector('#f_a').value, cur: b.querySelector('#f_a_c').value, date: b.querySelector('#f_d').value, note: b.querySelector('#f_n').value, inc: !!(b.querySelector('#f_inc') || {}).checked };
      editCat(null, id => editOp(op, sign, { ...keep, cat: id }));
    };
    b.querySelector('#f_save').onclick = () => {
      const a = num(b.querySelector('#f_a').value);
      if (!(a > 0)) return toast('Введите сумму больше нуля');
      const cy = b.querySelector('#f_a_c').value;
      if (!checkCur(cy)) return;
      const date = b.querySelector('#f_d').value || SEL;
      // курс фиксируется для сегодняшних и прошедших дат; при правке в той же валюте прежний курс сохраняется
      // пока не пришёл курс НБРБ на дату операции, считаем по текущему; freezeOps уточнит
      const same = op && op.cur === cy && op.date === date && op.rate;
      const rate = cy === BASE || date > today() ? undefined : same ? op.rate : rateOf(cy);
      const rdate = same ? op.rdate : undefined;
      const data = { date, amount: sign * a, cat: b.querySelector('input[name=cat]:checked').value, note: b.querySelector('#f_n').value.trim(), cur: cy === BASE ? undefined : cy, rate, rdate };
      const inc = SHARED && !!(b.querySelector('#f_inc') || {}).checked;
      if (isNew) (inc ? PRIV : S).ops.push({ id: uid(), ts: Date.now(), ...data });
      else if (inc === wasPriv) Object.assign(op, data);
      else {   // запись перенесли между общими и личными
        (wasPriv ? PRIV : S).ops = (wasPriv ? PRIV : S).ops.filter(o => o !== op);
        (inc ? PRIV : S).ops.push({ id: op.id, ts: op.ts, ...data });
      }
      haptic('success'); closeSheet(); commit(); selectDate(data.date);
      if (data.cur) freezeOps();
    };
    const del = b.querySelector('#f_del');
    if (del) del.onclick = () => { S.ops = S.ops.filter(o => o !== op); PRIV.ops = PRIV.ops.filter(o => o !== op); closeSheet(); commit(); };
  });
}

async function deleteAccount(a){
  const t = today(), now = accBal(a.id, t);
  const msg = Math.abs(now) > 0.005
    ? `Удалить «${a.name}»? ${fmtMoney(now)} вернутся на основной счёт, запланированные переводы по нему удалятся.`
    : `Удалить «${a.name}»? Запланированные переводы по нему удалятся.`;
  if (!(await ask(msg))) return;
  const planned = op => !(op.cat === 'move' && op.date > t && (op.from === a.id || op.to === a.id));
  S.ops = S.ops.filter(planned); PRIV.ops = PRIV.ops.filter(planned);
  if (Math.abs(now) > 0.005) pushMove({ id: uid(), ts: Date.now(), date: t, cat: 'move', from: now > 0 ? a.id : 'main', to: now > 0 ? 'main' : a.id, amount: Math.abs(now), note: 'Закрытие счёта' });
  a.archived = true;   // история переводов остаётся, счёт просто скрывается
  haptic('success'); closeSheet(); commit(); toast('Счёт удалён');
}

      const a = num(b.querySelector('#f_a').value), cy = b.querySelector('#f_a_c').value;
      const date = b.querySelector('#f_d').value || SEL, note = b.querySelector('#f_n').value.trim();
      if (from === to) return toast('Выберите разные счета');
      if (!(a > 0)) return toast('Введите сумму больше нуля');
      if (!checkCur(cy)) return;
      const same = op && op.cur === cy && op.date === date && op.rate;
      const rate = cy === BASE || date > today() ? undefined : same ? op.rate : rateOf(cy);
      const rdate = same ? op.rdate : undefined;
      // со счёта-копилки нельзя незаметно снять больше, чем на нём есть
      if (from !== 'main' && from !== 'ext'){
        const left = accBal(from, date, op) - toBase(a, cy, rate);
        if (left < -0.005 && !(await ask(`На счёте ${accLabel(from, ME)} не хватит денег: останется ${fmtMoney(left)}. Всё равно перевести?`))) return;
      }
      const data = { date, cat: 'move', from, to, amount: a, note, cur: cy === BASE ? undefined : cy, rate, rdate };
      const toPriv = isPrivMove(from, to);
      if (!op) pushMove({ id: uid(), ts: Date.now(), ...data });
      else if (toPriv === wasPriv) Object.assign(op, data);
      else {   // после правки перевод стал личным или общим — переносим
        (wasPriv ? PRIV : S).ops = (wasPriv ? PRIV : S).ops.filter(x => x !== op);
        pushMove({ id: op.id, ts: op.ts, ...data });
      }
      haptic('success'); closeSheet(); commit(); selectDate(date);
      if (data.cur) freezeOps();
    };
    const del = b.querySelector('#f_del');
    if (del) del.onclick = () => { S.ops = S.ops.filter(x => x !== op); PRIV.ops = PRIV.ops.filter(x => x !== op); closeSheet(); commit(); };
  });
}

function editOccurrence(e){
  const r = e.rule, ym = e.ym, monthName = fmtDate(ym + '-01', {month:'long'});
  const mi = +ym.slice(5) - 1, inMonth = MONTH_IN[mi], fromMonth = MONTH_GEN[mi];
  openSheet(`
    <h2>${KINDS[r.kind].icon} ${esc(r.name)}, ${monthName}</h2>
    <div class="two">
      ${amtField('Сумма', 'f_a', e.orig.amount, e.orig.cur, '')}
      <label class="field"><span>Число месяца</span><input id="f_d" inputmode="numeric" value="${e.day}"></label>
    </div>
    ${utilField(e.orig.util, e.orig.ucur, !KINDS[r.kind].util)}
    <p class="hint" style="margin:-4px 0 12px">Если указать 31, а в месяце меньше дней, будет последний день месяца.</p>
    <button class="btn block" id="f_one">Сохранить только в ${inMonth}</button>
    <button class="btn soft block" id="f_fwd">Сохранить с ${fromMonth} и дальше</button>
    <button class="btn soft block" id="f_skip">Пропустить в ${inMonth}</button>
    <button class="btn danger block" id="f_stop">Больше не повторять</button>`,
  b => {
    // Две отдельные кнопки вместо переключателя: область изменения выбирается самим нажатием
    const save = scope => {
      const amount = num(b.querySelector('#f_a').value), day = clampDay(b.querySelector('#f_d').value);
      if (!(amount >= 0)) return toast('Проверьте сумму');
      const cy = b.querySelector('#f_a_c').value;
      if (!checkCur(cy)) return;
      const util = KINDS[r.kind].util ? readUtil(b.querySelector('#f_u')) : 0, ucy = b.querySelector('#f_u_c').value;
      if (util && !checkCur(ucy)) return;
      if (scope === 'one') S.ov[r.id + '|' + ym] = { amount, day, ...curOpt(cy), ...utilOpt(util, ucy) };
      else setFrom(r, ym, { amount, day, ...curOpt(cy), ...utilOpt(util, ucy) });
      haptic('success'); closeSheet(); commit();
      toast(scope === 'one' ? `Изменено только в ${inMonth}` : `Изменено с ${fromMonth} и дальше`);
    };
    b.querySelector('#f_one').onclick = () => save('one');
    b.querySelector('#f_fwd').onclick = () => save('fwd');
    b.querySelector('#f_skip').onclick = () => { S.ov[r.id + '|' + ym] = { skip: true }; closeSheet(); commit(); };
    b.querySelector('#f_stop').onclick = async () => {
      if (!(await ask(`Остановить «${r.name}» начиная с ${fromMonth}?`))) return;
      setFrom(r, ym, { stop: true }); closeSheet(); commit();
    };
  });
}
/* Новая версия правила с месяца ym: всё, что было дальше, заменяется */
function setFrom(rule, ym, v){
  rule.v = rule.v.filter(x => x.from < ym);
  rule.v.push({ from: ym, ...v });
  for (const k of Object.keys(S.ov)){ const [id, kym] = k.split('|'); if (id === rule.id && kym >= ym) delete S.ov[k]; }
  if (rule.v.every(x => x.stop)) S.rules = S.rules.filter(x => x !== rule);
}

/* Добавление / изменение регулярного правила */
function editRule(rule){
  const t = parse(today()), curYm = ymKey(t.getFullYear(), t.getMonth());
  const v = rule ? (versionFor(rule, curYm) || rule.v[0]) : null;
  const kind = rule ? rule.kind : 'salary';
  openSheet(`
    <h2>${rule ? 'Изменить' : 'Новый регулярный'}</h2>
    ${rule ? '' : `<label class="field"><span>Тип</span><select id="f_k">${Object.entries(KINDS).map(([k, x]) => `<option value="${k}">${x.icon} ${x.name}</option>`).join('')}</select></label>`}
    <label class="field"><span>Название</span><input id="f_n" value="${esc(rule ? rule.name : KINDS[kind].name)}"></label>
    <div class="two">
      ${amtField('Сумма', 'f_a', v && !v.stop ? v.amount : '', v && v.cur)}
      <label class="field"><span>Число месяца</span><input id="f_d" inputmode="numeric" value="${v && !v.stop ? v.day : ''}" placeholder="1–31"></label>
    </div>
    ${utilField(v && !v.stop ? v.util : '', v && v.ucur, !KINDS[kind].util)}
    <label class="field"><span>${rule ? 'Новые значения действуют с месяца' : 'Начиная с месяца'}</span><input id="f_m" type="month" value="${curYm}"></label>
    ${rule ? '<p class="hint" style="margin:-4px 0 12px">Меняет сумму с выбранного месяца и <b>все следующие</b>. Чтобы изменить только один месяц, нажмите на начисление в календаре.</p>' : ''}
    <button class="btn block" id="f_save">Сохранить</button>
    ${rule ? '<button class="btn danger block" id="f_del">Удалить полностью (и из прошлого)</button>' : ''}`,
  b => {
    const k = b.querySelector('#f_k'), n = b.querySelector('#f_n');
    if (k) k.onchange = () => { n.value = KINDS[k.value].name; b.querySelector('#f_u_w').hidden = !KINDS[k.value].util; };
    b.querySelector('#f_save').onclick = () => {
      const amount = num(b.querySelector('#f_a').value), dv = b.querySelector('#f_d').value;
      if (!(amount > 0)) return toast('Введите сумму');
      if (!dv) return toast('Укажите число месяца');
      const cy = b.querySelector('#f_a_c').value;
      if (!checkCur(cy)) return;
      const day = clampDay(dv), from = b.querySelector('#f_m').value || curYm;
      const util = KINDS[rule ? rule.kind : k.value].util ? readUtil(b.querySelector('#f_u')) : 0, ucy = b.querySelector('#f_u_c').value;
      if (util && !checkCur(ucy)) return;
      if (rule){ rule.name = n.value.trim() || rule.name; setFrom(rule, from, { amount, day, ...curOpt(cy), ...utilOpt(util, ucy) }); }
      else S.rules.push({ id: uid(), kind: k.value, name: n.value.trim() || KINDS[k.value].name, v: [{ from, amount, day, ...curOpt(cy), ...utilOpt(util, ucy) }] });
      haptic('success'); closeSheet(); commit();
    };
    const del = b.querySelector('#f_del');
    if (del) del.onclick = async () => {
      if (!(await ask('Удалить полностью? Прогноз пересчитается.'))) return;
      S.rules = S.rules.filter(x => x !== rule); closeSheet(); commit();
    };
  });
}

/* ================== Быстрый ввод через бота ================== */
// Бот кладёт расходы на сервер (/api/inbox); при открытии и возвращении в приложение они забираются в S.ops,
// сохраняются, и только после успешной записи сервер получает подтверждение (/api/inbox_ack).
// Операции идемпотентны: повторно присланная (по id) не дублируется.
let QUICK = !!(API && inTg);
const normNote = t => String(t || '').toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ').trim();
async function flushSave(){
  clearTimeout(saveTimer);
  saveChain = saveChain.then(writeState);
  return saveChain;
}
let inboxBusy = false;
async function pullInbox(){
  if (!QUICK || LOAD_FAILED || LOCKED || inboxBusy || !$('sheet').hidden) return;
  inboxBusy = true;
  try {
    const r = await api('inbox', {});
    if (r.status !== 200 || !(r.data.items || []).length) return;
    let changed = false;
    for (const it of r.data.items){
      if (it.type === 'add' && it.op && !S.ops.some(o => o.id === it.op.id)){ S.ops.push(it.op); changed = true; }
      else if (it.type === 'update'){
        const o = S.ops.find(x => x.id === it.id);
        if (o){
          for (const k of ['amount', 'cat', 'date', 'note', 'cur']) if (k in (it.patch || {})){ if (it.patch[k] === null) delete o[k]; else o[k] = it.patch[k]; }
          if ('cur' in it.patch || 'date' in it.patch){ delete o.rate; delete o.rdate; }
          changed = true;
        }
      }
      else if (it.type === 'delete'){ const n = S.ops.length; S.ops = S.ops.filter(o => o.id !== it.id); changed = changed || S.ops.length !== n; }
    }
    if (changed){ saveState(); renderAll(); }
    if (await flushSave() !== false || !changed) await api('inbox_ack', { ids: r.data.items.map(i => i.rid) });
    if (changed) freezeOps();
  } catch(e){ console.error(e); }
  finally { inboxBusy = false; }
}
// Знания для бота: категории, самые частые из них и словарь «заметка → категория» из истории. Личные (инкогнито) записи сюда не попадают.
function buildProfile(){
  const cats = {}, since = addDays(today(), -90), used = {}, byNote = {};
  for (const [k, c] of Object.entries(allCats())) cats[k] = { n: c.n, i: c.i, ...(isHiddenCat(k) ? { hidden: true } : {}) };
  for (const o of S.ops){
    if (!(o.amount < 0) || o.cat === 'move' || !cats[o.cat]) continue;
    if (o.date >= since) used[o.cat] = (used[o.cat] || 0) + 1;
    const n = normNote(o.note).slice(0, 60);
    if (n){ const m = byNote[n] = byNote[n] || {}; m[o.cat] = (m[o.cat] || 0) + 1; }
  }
  const dict = {};
  Object.entries(byNote).map(([n, m]) => { const [cat, c] = Object.entries(m).sort((a, b) => b[1] - a[1])[0]; return [n, cat, c]; })
    .sort((a, b) => b[2] - a[2]).slice(0, 400).forEach(([n, cat]) => { dict[n] = cat; });
  const top = Object.keys(cats).filter(k => !cats[k].hidden && k !== 'plan').sort((a, b) => (used[b] || 0) - (used[a] || 0));
  return { base: BASE, cats, top, dict };
}
async function sendProfile(){
  if (!QUICK || LOAD_FAILED || LOCKED) return;
  try { await api('profile', { profile: buildProfile() }); } catch(e){ console.error(e); }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden){ pullInbox(); } });

/* ================== Старт ================== */
(async () => {
  const loaded = await loadState();
  if (LOCKED){ lockScreen(); return; }
  S = normalizeState(loaded && loaded.v ? loaded : blankState());
  BASE = S.settings.base;
  setSliderFill();
  renderAll(); selectDate(today());
  if (LOAD_FAILED) loadFailed();
  else if (!loaded) onboarding();
  await pullInbox();
  sendProfile();
  await refreshRates();
  freezeOps();
})();
